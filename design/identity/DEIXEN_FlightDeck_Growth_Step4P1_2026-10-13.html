:root[data-theme="dark"]{
  /* Kit v0.1 values */
  --surface-desk:#0c0c0c;          /* K3 ground */
  --surface-current:#181818;       /* K3 the light (= states sheet .v-strong l.114; G5 withdrawn) */
  --rail-lit:#fafafa;              /* K3 lit rail */
  --action-key:#f2f2f2;            /* K7 frosted white: interaction only */
  --key-line:rgba(242,242,242,.40);/* K10 control outline, 3.5:1 */
  --key-line-off:#2a2a2a;          /* K10 disabled */
  --text-danger:#e5675f;           /* K7 red */
  --action-danger:#e5675f;
  /* the Kit's value source (token block, dark) */
  --rule-strong:#333333;
  --open-edge:#666666;             /* K6: the dashed open end */
  --text-primary:#e8e8e8;
  --text-lit:#fafafa;              /* B3: .v-strong --text-record-cur (was #ededed) */
  --text-record:#e4e4e4;           /* B3: .v-strong (was #cfcfcf) */
  --text-secondary:#c4c4c4;        /* B3: .v-strong (was #a3a3a3) */
  --text-meta:#9c9c9c;             /* B3: .v-strong (was #8a8a8a) */
  --text-deixen:#9c9c9c;           /* B3: .v-strong (was #8a8a8a) */
  --text-disabled:#555555;
  --text-on-key:#111111;
  --focus-color:#f0f0f0;
  --mask:#2a2a2a;
  --rule:#242424;                  /* B1: the Terminal's rule under the bar */
  --rule-settled:#666666;          /* X1: the settled chain rule = the open edge's value (pattern carries the meaning) */
  --grid-rail:50px; --grid-text:76px; --grid-band:40px; /* X2: the Terminal's record grid (40 + 20 + 16; rail at 50) */
  /* sizes: Kit / its value source (Latin) */
  --fs-label:12px;  --lh-label:16px;   /* approved --type-label-size */
  --fs-prose:14.5px;  --lh-prose:21px; /* B3: .v-strong --fs-prose (was 14px); line height unchanged (G4 open) */
  --fs-q:13px;                          /* value source --fs-q: codes inside DEIXEN text */
  --fs-st:13px;                         /* approved --type-meta-size: status words */
  --fs-ui:14px;                         /* approved --type-ui-size: nav, controls */
  --fs-title:20px;  --lh-title:28px;   /* K1: the one title (task title size) */
  --fs-word:16px;                       /* a status word that is not the screen's title */
  --row:32px;
  --top:64px;                           /* B1: Terminal shell (tokens.css --layout-header 56px changes at Step 4) */
  --margin:32px;                        /* B1: Terminal shell (tokens.css 40px changes at Step 4) */
  --gap:48px;                           /* B1: Terminal shell (tokens.css 40px changes at Step 4) */
  --panel:420px;                        /* K10: the panel's 420px row */
  --inset:16px;                         /* K4 text inset */
  --ctl:28px;                           /* approved --layout-target-dense */
  --ctl-primary:32px;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
:root[data-theme="dark"][lang="ar"]{
  /* Arabic sizes: approved Arabic role tokens, one step over the Latin sizes */
  --fs-label:13px; --lh-label:20px;
  --fs-prose:15px; --lh-prose:24px;
  --fs-st:14px; --fs-ui:15px;
  --fs-title:22px; --lh-title:32px;
  --fs-word:17px;
  --sans:"Noto Sans Arabic","Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface-desk);}
html.gray{filter:grayscale(1)}
body{overflow:hidden}
.stage-wrap{width:100vw;height:100vh;overflow:hidden}
.stage{width:1200px;height:720px;position:relative;transform-origin:0 0;background:var(--surface-desk);
  font-family:var(--sans);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.code,.cmd{font-family:var(--mono);font-size:var(--fs-q);font-weight:400;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}

/* ---- top bar: B1/B2 = the Terminal's shell, copied from states sheet r1 (l.169-180, 354-356, 320). Wordmark hidden. ---- */
.hdr{position:absolute;left:0;top:0;width:1200px;height:var(--top);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--margin);direction:ltr;font-family:Inter,"Noto Sans Arabic",sans-serif}
.hdr .wm{font-size:11px;font-weight:600;letter-spacing:.29em;color:var(--text-primary);visibility:hidden}
.hdr .navw{position:absolute;left:50%;top:0;height:var(--top);transform:translateX(-50%);display:flex;gap:27px;align-items:center}
.hdr .nv{font-size:14px;font-weight:400;color:var(--text-meta);position:relative;height:var(--top);line-height:var(--top);white-space:nowrap;text-decoration:none}
.hdr .nv[aria-current="page"]{background:var(--surface-current);color:var(--text-lit);padding:0 16px;margin:0 -16px}
html[lang="ar"] .hdr .nv,.hdr .tlang [lang="ar"]{font-family:"Noto Sans Arabic",Inter,sans-serif}
.hdr .tlang{display:flex;align-items:center;font-size:14px;font-weight:400;color:var(--text-meta)}
.hdr .tlang .cur{color:var(--text-primary);display:inline-flex;align-items:center}
.hdr .tlang .oth{color:var(--text-meta)}
.hdr .vsep{display:inline-block;width:1px;height:14px;background:var(--rule-strong);margin:0 16px;vertical-align:middle}

/* ---- composition (K8 extended): the path on the left, DEIXEN's reading in the panel on the right ---- */
.col-op{position:absolute;top:80px;left:var(--margin);width:calc(1200px - 2*var(--margin) - var(--gap) - var(--panel))}
.col-panel{position:absolute;top:80px;left:calc(1200px - var(--margin) - var(--panel));width:var(--panel)}
.col-op > .head,.col-op > .title{padding-inline-start:var(--grid-text)}
.head{height:var(--lh-label);font-size:var(--fs-label);line-height:var(--lh-label);color:var(--text-deixen);
  display:flex;justify-content:space-between;align-items:center}
.title{margin-top:8px;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-primary)}
.word{margin-top:8px;font-size:var(--fs-word);line-height:var(--lh-title);font-weight:500;color:var(--text-primary)}
.prose{font-size:var(--fs-prose);line-height:var(--lh-prose);color:var(--text-secondary)}
.basis{margin-top:6px}
.label{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--text-deixen)}
.sec{margin-top:32px}

/* ---- controls (K10) ---- */
.ctl{display:inline-flex;align-items:center;height:var(--ctl);padding:0 12px;border:1px solid var(--key-line);
  border-radius:2px;font-size:var(--fs-ui);font-weight:500;color:var(--action-key);white-space:nowrap}
.ctl.primary{height:var(--ctl-primary);background:var(--action-key);border-color:var(--action-key);
  color:var(--text-on-key);font-weight:600}
.ctl.danger{border-color:var(--action-danger);color:var(--text-danger)}
.ctl-line{margin-top:12px}

/* ---- the chain: one sequence on one rule (K5, as the booking line and the hint ladder) ---- */
.listhead{margin-top:12px;display:grid;grid-template-columns:56px 1fr 144px;padding-inline-start:var(--grid-text);
  font-size:var(--fs-label);line-height:var(--lh-label);color:var(--text-deixen)}
.listhead .lh1{grid-column:1 / span 2}
.chain{list-style:none;margin-top:8px}
.row{position:relative;isolation:isolate;display:grid;grid-template-columns:56px 1fr 144px;align-items:start;
  padding-inline-start:var(--grid-text);min-height:var(--row)}
.row > .cmd,.row > .rt,.row > .st{padding-top:6px;padding-bottom:5px}
.row .cmd{color:var(--text-record);line-height:21px;direction:ltr;text-align:start;unicode-bidi:isolate}
html[lang="ar"] .row .cmd{text-align:right}
.row .rt{font-size:var(--fs-prose);line-height:21px;color:var(--text-secondary);padding-inline-end:12px} /* X2: a gap before the status column */
.row .st{font-size:var(--fs-st);line-height:21px;color:var(--text-secondary)}
.row .st.quiet{color:var(--text-meta)}
.chain .row::before{content:"";position:absolute;inset-inline-start:var(--grid-rail);top:0;bottom:0;width:0;border-inline-start:1px solid var(--rule-settled)}
.chain .row.open::before{border-inline-start-style:dashed;border-color:var(--open-edge)}
.chain.closed .row:last-child::before{bottom:8px}
.chain.closed .row:last-child::after{content:"";position:absolute;inset-inline-start:var(--grid-rail);bottom:0;width:16px;height:9px;
  border-inline-start:1px solid var(--rule-settled);border-bottom:1px solid var(--rule-settled);border-end-start-radius:4px}
.rows-opt{list-style:none;margin-top:8px}
/* K3: the light — one "now" per region; the band adds, older rows are never dimmed */
.row .band{position:absolute;z-index:-1;inset-inline-start:var(--grid-band);inset-inline-end:0;top:0;bottom:0;background:var(--surface-current)}
.chain .row.lit::before{border-color:var(--rail-lit)}
.row.lit .cmd,.row.lit .rt,.row.lit .st{color:var(--text-lit)}
.row.lit .st{font-weight:400}            /* X3: K3 lights, never bolds */
.row .more{grid-column:2 / span 2;padding-bottom:14px}
.row .obj2{grid-column:2;padding-bottom:14px}
.row .act{grid-column:3;padding-bottom:14px}
.row .obj{font-size:var(--fs-prose);line-height:var(--lh-prose);color:var(--text-record);max-width:440px}
.row .more .ctl{margin-top:12px}
.rows-off{list-style:none;margin-top:12px}      /* X2: 24 -> 12, the stage height */
.rows-off .row .more .ctl{margin-top:6px}

/* ---- panel lists ---- */
.plan{list-style:none;margin-top:8px}
.plan li{display:flex;justify-content:space-between;align-items:baseline;min-height:var(--row);padding-top:6px}
.plan .pn{font-size:var(--fs-prose);color:var(--text-secondary)}
.plan .ps{font-size:var(--fs-st);color:var(--text-meta)}
.statuses{list-style:none;margin-top:8px}
.statuses li{height:var(--row);display:flex;align-items:center;padding-inline-start:12px;
  font-size:var(--fs-prose);color:var(--text-secondary)}
.statuses li.lit{background:var(--surface-current);color:var(--text-lit);font-weight:400} /* X3 */
.note{margin-top:20px}
.note .nh{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--text-deixen)}
.note .nt{margin-top:6px;font-size:var(--fs-prose);line-height:var(--lh-prose);color:var(--text-record)}
.empty{margin-top:8px;font-size:var(--fs-prose);line-height:var(--lh-prose);color:var(--text-record)}

/* test condition: the name masked in text (blind board only) */
html.blind .nm{color:transparent;background:var(--mask);border-radius:1px}
</style>
</head>
<body>
<div class="stage-wrap"><div class="stage" id="stage"></div></div>
<script>
const S = {"L01-AN.title": {"en": "Find flights with AN", "ar": "البحث عن الرحلات بالأمر AN"}, "L01-AN.objective": {"en": "Request an availability display for a date and a city pair.", "ar": "طلب عرض التوافر لتاريخ ومسار (مدينتين) محددين."}, "L02-SS.title": {"en": "Sell a seat with SS", "ar": "بيع مقعد بالأمر SS"}, "L02-SS.objective": {"en": "Sell seats in one booking class from the line of an availability display.", "ar": "بيع مقاعد في درجة حجز واحدة من سطر في شاشة التوافر."}, "L03-NM.title": {"en": "Add the passenger name with NM", "ar": "إضافة اسم الراكب بالأمر NM"}, "L03-NM.objective": {"en": "Enter the passenger's name with the correct count, surname, first name and title.", "ar": "إدخال اسم الراكب بالعدد الصحيح واسم العائلة والاسم الأول واللقب."}, "L04-AP.title": {"en": "Add a contact with AP", "ar": "إضافة جهة اتصال بالأمر AP"}, "L04-AP.objective": {"en": "Add the booking's contact element as free text with the phone number the task gives.", "ar": "إضافة عنصر الاتصال في الحجز كنص حر برقم الهاتف الذي تعطيه المهمة."}, "L05-CTC.title": {"en": "Pass the passenger's contact to the airline: SRCTCM (and SRCTCR)", "ar": "إرسال بيانات اتصال الراكب لشركة الطيران: SRCTCM (و SRCTCR)"}, "L05-CTC.objective": {"en": "Transfer the passenger's mobile number to the airline with SRCTCM, or record a refusal with SRCTCR.", "ar": "تحويل رقم جوال الراكب إلى شركة الطيران بالأمر SRCTCM، أو تسجيل رفضه بالأمر SRCTCR."}, "L06-TK.title": {"en": "Set the ticketing arrangement with TK", "ar": "تحديد ترتيب إصدار التذكرة بالأمر TK"}, "L06-TK.objective": {"en": "Add the ticketing arrangement element the task asks for.", "ar": "إضافة عنصر ترتيب إصدار التذكرة الذي تطلبه المهمة."}, "L07-RF.title": {"en": "Record who asked for the booking: RF", "ar": "تسجيل مَن طلب الحجز: RF"}, "L07-RF.objective": {"en": "Add the Received From element naming who requested the booking.", "ar": "إضافة عنصر Received From الذي يذكر مَن طلب الحجز."}, "L08-ER.title": {"en": "End the transaction with ER", "ar": "إنهاء المعاملة بالأمر ER"}, "L08-ER.objective": {"en": "End the transaction when every required element is present, and read the result.", "ar": "إنهاء المعاملة عندما تكتمل كل العناصر المطلوبة، وقراءة النتيجة."}, "L09-FXP.title": {"en": "Price the booking with FXP", "ar": "تسعير الحجز بالأمر FXP"}, "L09-FXP.objective": {"en": "Price the booking in its booked class and store the result.", "ar": "تسعير الحجز بدرجته المحجوزة وحفظ النتيجة."}, "L10-FQD.title": {"en": "Optional: look at fares with FQD", "ar": "اختياري: عرض الأسعار بالأمر FQD"}, "L10-FQD.objective": {"en": "Display the fares for a city pair.", "ar": "عرض الأسعار لمسار بين مدينتين."}, "ui.task": {"en": "Task", "ar": "المهمة"}, "task.title": {"en": "Book and price a one-way flight", "ar": "حجز رحلة ذهاب فقط وتسعيرها"}, "ui.chain.label": {"en": "Booking chain", "ar": "سلسلة الحجز"}, "ui.status": {"en": "Status", "ar": "الحالة"}, "ui.chain.next": {"en": "Next", "ar": "التالي"}, "ui.chain.optional": {"en": "Optional", "ar": "اختياري"}, "ui.doneOnYourOwn": {"en": "Done on your own", "ar": "نفّذتها بمفردك"}, "ui.lesson.start": {"en": "Start lesson {N}", "ar": "ابدأ الدرس {N}"}, "ui.lesson.practise": {"en": "Practise {CMD} in the Terminal", "ar": "تدرّب على {CMD} في الطرفية"}, "ui.term.startAssessment": {"en": "Start assessment", "ar": "ابدأ التقييم"}, "ui.fd.openGrowth": {"en": "Open Growth", "ar": "افتح التطوّر"}, "ui.fd.openScenario": {"en": "Open scenario", "ar": "افتح السيناريو"}, "ui.fd.moreScenarios": {"en": "More scenarios", "ar": "سيناريوهات أخرى"}, "ui.fd.csTrack": {"en": "Customer Service track", "ar": "مسار خدمة العملاء"}, "ui.planned": {"en": "Planned · not available yet", "ar": "مخطَّط · غير متاح بعد"}, "disc.title": {"en": "What this simulator does and does not do", "ar": "ما الذي يفعله هذا المحاكي وما لا يفعله"}, "ui.growth.completed": {"en": "Completed", "ar": "مكتمل"}, "ui.growth.inProgress": {"en": "In progress", "ar": "قيد التقدم"}, "ui.growth.needsPractice": {"en": "Needs more practice", "ar": "يحتاج مزيدًا من التدريب"}, "ui.growth.empty": {"en": "Nothing recorded yet. Your status appears after you finish a lesson or make your first practice entry.", "ar": "لا يوجد شيء مسجَّل بعد. ستظهر حالتك بعد أن تُنهي درسًا أو تكتب أول إدخال تدريب."}, "ui.growth.basis": {"en": "This status comes only from your recorded practice in DEIXEN. It is not a job-readiness score.", "ar": "هذه الحالة مبنية فقط على تدريبك المسجَّل في DEIXEN. وليست درجة جاهزية للعمل."}, "ui.growth.recorded": {"en": "Recorded practice", "ar": "التدريب المسجَّل"}, "ui.growth.recordedHere": {"en": "Recorded practice in this browser", "ar": "التدريب المسجَّل في هذا المتصفح"}, "ui.growth.statuses": {"en": "The three statuses", "ar": "الحالات الثلاث"}, "ui.growth.assessmentRow": {"en": "Assessment", "ar": "التقييم"}, "ui.reset.everything": {"en": "Reset everything", "ar": "إعادة ضبط كل شيء"}, "ui.panel.coach": {"en": "Coach", "ar": "المدرّب"}, "coach.growth.reinforce": {"en": "Needs practice again: {COMMANDS}. A new error came after earlier correct entries.", "ar": "يحتاج إلى تدريب من جديد: {COMMANDS}. ظهر خطأ جديد بعد إدخالات صحيحة سابقة."}, "coach.growth.assessmentUnmet": {"en": "The last assessment did not count every step as correct. A new assessment can show the full path working.", "ar": "آخر تقييم لم تُحتسب فيه كل الخطوات صحيحة. يمكن لتقييم جديد أن يُظهر المسار الكامل يعمل."}, "scn.title": {"en": "Scenario: the passenger refuses to give a mobile number", "ar": "سيناريو: الراكب يرفض إعطاء رقم جواله"}, "ui.area.flightDeck": {"en": "Flight Deck", "ar": "قمرة القيادة"}, "ui.area.learning": {"en": "Learning", "ar": "التعلّم"}, "ui.area.terminal": {"en": "Terminal", "ar": "الطرفية"}, "ui.area.scenarioBank": {"en": "Scenario Bank", "ar": "بنك السيناريوهات"}, "ui.area.growth": {"en": "Growth", "ar": "التطوّر"}, "ui.nav.areas": {"en": "Areas", "ar": "الأقسام"}, "ui.nav.homeLink": {"en": "DEIXEN, Flight Deck", "ar": "DEIXEN، قمرة القيادة"}, "ui.nav.language": {"en": "Language", "ar": "اللغة"}, "ui.lang.en": {"en": "English", "ar": "English"}, "ui.lang.ar": {"en": "العربية", "ar": "العربية"}, "ui.brand.name": {"en": "DEIXEN", "ar": "DEIXEN"}, "ui.correctInDeixen": {"en": "Correct in DEIXEN", "ar": "صحيح في DEIXEN"}};
const P = Object.fromEntries(new URLSearchParams(location.hash.replace(/^#/, '')));
const LANG = P.lang === 'ar' ? 'ar' : 'en';
const SCREEN = P.screen === 'gr' ? 'gr' : 'fd';
const MOMENT = ['0','1','2'].includes(P.m) ? +P.m : 1;
document.documentElement.lang = LANG;
if (P.gray === '1') document.documentElement.classList.add('gray');
if (P.blind === '1') document.documentElement.classList.add('blind');
const DIR = LANG === 'ar' ? 'rtl' : 'ltr';

/* The booking chain: command codes as board P1-01 shows them; words from the lesson titles. */
const CHAIN = [
  {cmd:'AN', l:'L01-AN', n:1}, {cmd:'SS', l:'L02-SS', n:2}, {cmd:'NM', l:'L03-NM', n:3},
  {cmd:'AP', l:'L04-AP', n:4}, {cmd:'SRCTCM', l:'L05-CTC', n:5}, {cmd:'TK', l:'L06-TK', n:6},
  {cmd:'RF', l:'L07-RF', n:7}, {cmd:'ER', l:'L08-ER', n:8}, {cmd:'FXP', l:'L09-FXP', n:9},
  {cmd:'FQD', l:'L10-FQD', n:10, optional:true}
];
/* Three moments, each a consistent evidence state (Build Spec §7A item 13, §7B items 11 and 19, §7C item 8):
   1 = board P1-01's moment (AN, SS, NM done on your own; Next AP; In progress)
   2 = all nine done on your own; the last assessment ended without every item met (Needs more practice; action (c))
   0 = an empty record (fresh learner; Next AN) */
const MOMENTS = {
  1: {done:[0,1,2], status:'ui.growth.inProgress', cur:'ui.growth.inProgress', action:{kind:'lesson', i:3}, coach:null},
  2: {done:[0,1,2,3,4,5,6,7,8], status:'ui.growth.needsPractice', cur:'ui.growth.needsPractice', action:{kind:'assessment'}, coach:'coach.growth.assessmentUnmet'},
  0: {done:[], status:null, cur:null, action:{kind:'lesson', i:0}, coach:null}
};
const M = MOMENTS[MOMENT];

const CODE_RE = /\b(SRCTCM|SRCTCR|FXP|FQD|AN|SS|NM|AP|TK|RF|ER)\b|(DEIXEN)/g;
function str(key, fill) {
  let s = S[key][LANG];
  if (fill) for (const [k, v] of Object.entries(fill)) s = s.split('{' + k + '}').join(v);
  return s;
}
/* Words with K1's two voices: Amadeus codes in mono (isolated left-to-right); the name wrapped for the blind mask. */
function fillText(node, s) {
  let last = 0; CODE_RE.lastIndex = 0; let m;
  while ((m = CODE_RE.exec(s))) {
    if (m.index > last) node.appendChild(document.createTextNode(s.slice(last, m.index)));
    const sp = document.createElement('span');
    if (m[1]) { sp.className = 'code'; sp.dir = 'ltr'; } else { sp.className = 'nm'; }
    sp.textContent = m[0]; node.appendChild(sp); last = m.index + m[0].length;
  }
  if (last < s.length) node.appendChild(document.createTextNode(s.slice(last)));
  return node;
}
function T(tag, cls, key, fill, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (key) { e.dataset.src = key; if (fill) e.dataset.fill = JSON.stringify(fill); fillText(e, str(key, fill)); }
  if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function E(tag, cls, kids, attrs) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  (kids || []).forEach(k => k && e.appendChild(k));
  if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const dash = () => { const e = E('span', 'st quiet'); e.textContent = '—'; e.dataset.src = 'D40:dash'; return e; };

/* ---- top bar: B1 the Terminal's markup (states sheet r1, S3 header): current language first, divider, the other ---- */
function topBar(current) {
  const areas = [['ui.area.flightDeck','fd'],['ui.area.learning'],['ui.area.terminal'],['ui.area.scenarioBank'],['ui.area.growth','gr']];
  const nav = E('nav', 'navw', [], {'aria-label': str('ui.nav.areas')});
  areas.forEach(([k, id]) => {
    const a = T('a', 'nv', k, null, {href: '#'});
    if (LANG === 'ar') a.dir = 'rtl';
    if (id === current) a.setAttribute('aria-current', 'page');
    nav.appendChild(a);
  });
  const curK = LANG === 'en' ? 'ui.lang.en' : 'ui.lang.ar', othK = LANG === 'en' ? 'ui.lang.ar' : 'ui.lang.en';
  const lang = E('div', 'tlang', [
    E('span', 'cur', [T('span', null, curK)], {lang: LANG}),
    E('span', 'vsep'),
    E('span', 'oth', [T('span', null, othK)], {lang: LANG === 'en' ? 'ar' : 'en'})
  ], {'aria-label': str('ui.nav.language')});
  const wm = E('div', 'wm', [], {'aria-hidden': 'true', 'data-wordmark': '', 'data-note': 'wordmark hidden (test condition)'});
  return E('header', 'hdr', [wm, nav, lang]);
}

/* ---- one chain row ---- */
function chainRow(c, i, opts) {
  const done = M.done.includes(i);
  const li = E('li', 'row');
  const cmd = E('span', 'cmd'); cmd.textContent = c.cmd; cmd.dataset.src = 'board:P1-01#cmd'; cmd.dir = 'ltr';
  li.appendChild(cmd);
  li.appendChild(T('span', 'rt', c.l + '.title'));
  const isNext = opts.next === i;
  if (!done && !c.optional) li.classList.add('open');
  if (isNext) { li.classList.add('lit'); li.appendChild(E('span', 'band', [], {'aria-hidden': 'true'})); li.appendChild(T('span', 'st', 'ui.chain.next')); }
  else if (c.optional) li.appendChild(T('span', 'st quiet', 'ui.chain.optional'));
  else if (done) li.appendChild(T('span', 'st', 'ui.doneOnYourOwn'));
  else li.appendChild(dash());
  if (isNext) {
    li.appendChild(E('div', 'obj2', [T('p', 'obj', c.l + '.objective')]));
    li.appendChild(E('div', 'act', [T('button', 'ctl primary', 'ui.lesson.start', {N: String(c.n)})]));
  }
  return li;
}

/* ---- the required chain on one rule; FQD (optional, not required for Completed) under it, off the rule ---- */
function chainList(opts, style) {
  const req = CHAIN.filter(c => !c.optional), all9 = req.every((c, i) => M.done.includes(i));
  const ol = E('ol', 'chain' + (all9 ? ' closed' : ''), req.map((c, i) => chainRow(c, i, opts)), style ? {style} : null);
  const opt = E('ul', 'rows-opt', CHAIN.map((c, i) => c.optional ? chainRow(c, i, opts) : null).filter(Boolean));
  const wrap = E('div', null, [ol, opt]); return wrap;
}

/* ---- the assessment and scenario rows (off the chain's rule: not members of the sequence) ---- */
function offRows(withActions) {
  const ol = E('ul', 'rows-off');
  const a = E('li', 'row');
  a.appendChild(E('span', 'cmd'));
  a.appendChild(T('span', 'rt', 'ui.growth.assessmentRow'));
  a.appendChild(dash());
  if (withActions && M.action.kind === 'assessment') {
    a.classList.add('lit'); a.appendChild(E('span', 'band', [], {'aria-hidden': 'true'}));
    a.appendChild(E('div', 'act', [T('button', 'ctl primary', 'ui.term.startAssessment')]));   /* X4: same place as Start lesson */
  }
  ol.appendChild(a);
  const s = E('li', 'row');
  s.appendChild(E('span', 'cmd'));
  s.appendChild(T('span', 'rt', 'scn.title'));
  s.appendChild(dash());
  if (withActions) s.appendChild(E('div', 'more', [T('button', 'ctl', 'ui.fd.openScenario')]));
  ol.appendChild(s);
  return ol;
}

function flightDeck() {
  const next = M.action.kind === 'lesson' ? M.action.i : -1;
  const op = E('section', 'col-op', [
    T('div', 'head', 'ui.task'),
    T('h1', 'title', 'task.title'),
    E('div', 'listhead', [T('span', 'lh1', 'ui.chain.label'), T('span', 'lh2', 'ui.status')]),
    chainList({next}),
    offRows(true)
  ], {dir: DIR});
  const status = M.status
    ? [T('p', 'word', M.status), T('p', 'prose basis', 'ui.growth.basis')]
    : [T('p', 'empty', 'ui.growth.empty')];
  const panel = E('aside', 'col-panel', [
    T('div', 'head', 'ui.status'),
    ...status,
    E('div', 'ctl-line', [T('button', 'ctl', 'ui.fd.openGrowth')]),
    E('div', 'sec', [
      T('div', 'label', 'ui.area.scenarioBank'),
      E('ul', 'plan', [
        E('li', null, [T('span', 'pn', 'ui.fd.moreScenarios'), T('span', 'ps', 'ui.planned')]),
        E('li', null, [T('span', 'pn', 'ui.fd.csTrack'), T('span', 'ps', 'ui.planned')])
      ])
    ]),
    E('div', 'sec', [T('button', 'ctl', 'disc.title')])
  ], {dir: DIR});
  return [topBar('fd'), E('main', null, [op, panel])];
}

function growth() {
  const op = E('section', 'col-op', [
    T('div', 'head', 'ui.growth.recorded'),
    chainList({next: -1}, 'margin-top:12px'),
    offRows(false)
  ], {dir: DIR});
  const kids = [T('div', 'head', 'ui.status')];
  if (M.status) {
    kids.push(T('p', 'title', M.status), T('p', 'prose basis', 'ui.growth.basis'));
    if (M.coach) kids.push(E('div', 'note', [T('div', 'nh', 'ui.panel.coach'), T('p', 'nt', M.coach)]));
  } else {
    kids.push(T('p', 'empty', 'ui.growth.empty'), E('div', 'ctl-line', [T('button', 'ctl primary', 'ui.lesson.start', {N: '1'})]));
  }
  const st = E('ul', 'statuses');
  ['ui.growth.completed', 'ui.growth.inProgress', 'ui.growth.needsPractice'].forEach(k => {
    const li = T('li', null, k);
    if (M.cur === k) { li.classList.add('lit'); li.setAttribute('aria-current', 'true'); }
    st.appendChild(li);
  });
  kids.push(E('div', 'sec', [T('div', 'label', 'ui.growth.statuses'), st]));
  if (M.status) kids.push(E('div', 'sec', [T('p', 'prose', 'ui.growth.recordedHere'), E('div', 'ctl-line', [T('button', 'ctl danger', 'ui.reset.everything')])]));
  const panel = E('aside', 'col-panel', kids, {dir: DIR});
  return [topBar('gr'), E('main', null, [op, panel])];
}

const stage = document.getElementById('stage');
(SCREEN === 'fd' ? flightDeck() : growth()).forEach(n => stage.appendChild(n));
document.title = (SCREEN === 'fd' ? 'Flight Deck' : 'Growth') + ' · ' + LANG.toUpperCase() + ' · moment ' + MOMENT;
function fit() { const s = window.innerWidth / 1200; stage.style.transform = 'scale(' + s + ')'; }
fit(); addEventListener('resize', fit); addEventListener('hashchange', () => location.reload());
</script>
</body>
